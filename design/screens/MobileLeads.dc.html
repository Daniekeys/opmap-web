<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: Lekki bakeries</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6B1D3E}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F8; color: #17131A; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 22px; display: flex; flex-direction: column; overflow: hidden;">
  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px;">
    <a href="MobileMenu.dc.html" aria-label="Open menu" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17131A" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.01em;">Lekki bakeries</h1>
    <button type="button" aria-label="Search" style="width: 44px; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17131A" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px;">
    <p style="margin: 0; color: #5F5A62; font-size: 14px; line-height: 20px;">12 strong fits haven't been contacted. 7 are in Lekki Phase 1 and Ikate.</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border: 1px solid #EAE4E6; border-radius: 8px;">
      <div style="padding: 10px 12px; display: flex; flex-direction: column;"><span style="font-size: 13px; color: #5F5A62;">Good fits</span><span style="font-size: 20px; line-height: 26px; font-weight: 500; font-variant-numeric: tabular-nums;">159</span></div>
      <div style="padding: 10px 12px; display: flex; flex-direction: column; border-left: 1px solid #F2EDEF;"><span style="font-size: 13px; color: #5F5A62;">Messaged</span><span style="font-size: 20px; line-height: 26px; font-weight: 500; font-variant-numeric: tabular-nums;">9</span></div>
      <div style="padding: 10px 12px; display: flex; flex-direction: column; border-left: 1px solid #F2EDEF;"><span style="font-size: 13px; color: #5F5A62;">Replied</span><span style="font-size: 20px; line-height: 26px; font-weight: 500; font-variant-numeric: tabular-nums;">3</span></div>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto;">
      <button type="button" style="flex: none; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #17131A; background: #17131A; color: #FFFFFF; font-size: 14px; font-weight: 500;">Not contacted</button>
      <button type="button" style="flex: none; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #D6CDD1; background: #FFFFFF; color: #17131A; font-size: 14px;">Has WhatsApp</button>
      <button type="button" style="flex: none; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #D6CDD1; background: #FFFFFF; color: #17131A; font-size: 14px;">No website</button>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; margin-top: 12px; background: #FFFFFF; border-top: 1px solid #EAE4E6;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a href="MobileDetail.dc.html" style="display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 16px; border-bottom: 1px solid #F2EDEF; color: #17131A; text-decoration: none;">
        <span style="flex: none; width: 40px; height: 40px; border-radius: 6px; background: {{r.bg}}; color: {{r.fg}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px;">{{r.ini}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</span><span style="flex: none; font-size: 13px; color: {{r.fitFg}}; font-weight: 500;">{{r.fit}}</span></span>
          <span style="font-size: 13px; line-height: 18px; color: #5F5A62; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.meta}}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #EAE4E6; background: #FFFFFF; padding: 4px 4px 16px;">
    <a href="MobileLeads.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 12px; font-weight: 600; color: #6B1D3E; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B8336A" stroke-width="1.75" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Leads</a>
    <a href="MobileComposer.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 12px; color: #5F5A62; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F5A62" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"></path></svg>To send 4</a>
    <a href="Pipeline.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 12px; color: #5F5A62; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F5A62" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 4v16M12 4v10M19 4v6"></path></svg>Replies</a>
    <a href="MobileMenu.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 12px; color: #5F5A62; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F5A62" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var S = '#6B1D3E', G = '#5F5A62';
    return { rows: [
      { ini:'CC', bg:'#F9E0EA', fg:'#9B2456', name:'Crumbs and Co. Bakery', meta:'Lekki Phase 1. 4.6 (210). WhatsApp confirmed', fit:'Strong fit', fitFg:S },
      { ini:'MT', bg:'#DDEBF6', fg:'#1D5F8A', name:'Mama Tobi Pastries', meta:'Ikate. 4.8 (96). Phone confirmed', fit:'Strong fit', fitFg:S },
      { ini:'AC', bg:'#DCF1E4', fg:'#0F5E3A', name:'Adewole Cake Studio', meta:'Chevron. 4.9 (41). WhatsApp confirmed', fit:'Strong fit', fitFg:S },
      { ini:'SK', bg:'#FBEFCF', fg:'#7A5300', name:'Sweet Kitchen Confectionery', meta:'Osapa. 4.3 (155). WhatsApp likely', fit:'Good fit', fitFg:G },
      { ini:'TR', bg:'#DCF2F0', fg:'#0F5E5A', name:'The Rolling Pin', meta:'Agungi. 4.5 (63). Email found on site', fit:'Good fit', fitFg:G },
      { ini:'GB', bg:'#F1EADB', fg:'#5C4A1F', name:'Golden Bread House', meta:'Ikate. 4.4 (88). Email guessed', fit:'Good fit', fitFg:G }
    ] };
  }
}
</script>
</body>
</html>
